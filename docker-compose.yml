services:
  mailbridge:
    build: .
    image: mailbridge:latest
    container_name: mailbridge
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/mailbridge.db
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
